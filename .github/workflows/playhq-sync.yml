name: PlayHQ Sync

on:
  schedule:
    # 4pm AEST on Sunday and game days (Mon/Tue/Wed/Fri).
    - cron: '0 6 * * 0,1,2,3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: What should run?
        required: true
        default: full
        type: choice
        options:
          - full
          - static

permissions:
  contents: read

concurrency:
  group: playhq-sync-rebuild
  cancel-in-progress: true

jobs:
  rebuild-and-deploy:
    name: Full PlayHQ rebuild and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh teams data
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
          PLAYHQ_TENANT: ${{ secrets.PLAYHQ_TENANT }}
          PLAYHQ_CLUB_NAME: ${{ secrets.PLAYHQ_CLUB_NAME }}
        run: |
          node scripts/scrape-playhq-teams.js
          node scripts/scrape-playhq-teams-details.js

      - name: Refresh fixtures, schedule, scores, and ladders
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
          PLAYHQ_TENANT: ${{ secrets.PLAYHQ_TENANT }}
          PLAYHQ_SEASON_IDS: ${{ secrets.PLAYHQ_SEASON_IDS }}
          PLAYHQ_CLUB_NAME: ${{ secrets.PLAYHQ_CLUB_NAME }}
          PLAYHQ_CLUB_MATCH: ${{ secrets.PLAYHQ_CLUB_NAME }}
          PLAYHQ_SEASON_NAME: ${{ secrets.PLAYHQ_SEASON_NAME }}
        run: |
          npm run scores:refresh
          npm run scores:check
          node scripts/scrape-weekly-games.js
          node scripts/check-weekly-games-data.js
          npm run home-scores:refresh
          npm run home-scores:check

      - name: Refresh round schedule files
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
          PLAYHQ_TENANT: ${{ secrets.PLAYHQ_TENANT }}
          PLAYHQ_SEASON_IDS: ${{ secrets.PLAYHQ_SEASON_IDS }}
          PLAYHQ_SEASON_NAME: ${{ secrets.PLAYHQ_SEASON_NAME }}
          PLAYHQ_CLUB_NAME: ${{ secrets.PLAYHQ_CLUB_NAME }}
        run: |
          node scripts/write-round-files.js
          npm run rounds:check

      - name: Publish static artifacts to public/live-data
        run: |
          mkdir -p public/live-data
          cp scripts/weekly-games-data.json public/live-data/fixtures.json
          cp scripts/scores-data.json public/live-data/completed-scores.json
          cp scripts/home-games-data.json public/live-data/home-games.json

      - name: Build site
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to VentraIP via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_PORT" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Missing one or more FTP secrets"
            exit 1
          fi

          FTP_REMOTE_DIR="${FTP_REMOTE_DIR:-.}"
          if [ "$FTP_REMOTE_DIR" = "public_html" ] || [ "$FTP_REMOTE_DIR" = "/public_html" ] || [[ "$FTP_REMOTE_DIR" == *"/public_html" ]]; then
            echo "FTP_REMOTE_DIR must be the document root itself (use '.'), not a nested public_html folder."
            exit 1
          fi

          lftp -c "
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p \"$FTP_PORT\" ftp://$FTP_HOST;
            mirror --reverse --delete --verbose --exclude-glob live-data/live-scores.json dist/ \"$FTP_REMOTE_DIR\";
            bye
          "
