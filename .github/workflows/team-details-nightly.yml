name: Nightly Team Details Sync

on:
  schedule:
    # 11:59pm Australia/Melbourne every night.
    # Run at both possible UTC offsets; the Melbourne gate below allows only the matching run.
    - cron: '59 12,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-team-details-sync
  cancel-in-progress: true

jobs:
  refresh-team-details:
    name: Refresh team ladders and results
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Melbourne nightly window
        id: melbourne-window
        if: github.event_name == 'schedule'
        env:
          TZ: Australia/Melbourne
        run: |
          local_time="$(date +%H%M)"

          if [ "$local_time" = "2359" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Within Australia/Melbourne nightly team update window."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside Australia/Melbourne nightly team update window."
          fi

      - name: Refresh team list and details
        if: github.event_name != 'schedule' || steps.melbourne-window.outputs.should_run == 'true'
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
          PLAYHQ_TENANT: ${{ secrets.PLAYHQ_TENANT }}
          PLAYHQ_CLUB_NAME: ${{ secrets.PLAYHQ_CLUB_NAME }}
          PLAYHQ_SEASON_IDS: ${{ secrets.PLAYHQ_SEASON_IDS }}
        run: |
          node scripts/scrape-playhq-teams.js
          node scripts/scrape-playhq-teams-details.js
          mkdir -p public/live-data
          cp scripts/teams-details.json public/live-data/teams-details.json

      - name: Install lftp
        if: github.event_name != 'schedule' || steps.melbourne-window.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy team details JSON only
        if: github.event_name != 'schedule' || steps.melbourne-window.outputs.should_run == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_PORT" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Missing one or more FTP secrets"
            exit 1
          fi

          FTP_REMOTE_DIR="${FTP_REMOTE_DIR:-.}"
          if [ "$FTP_REMOTE_DIR" = "public_html" ] || [ "$FTP_REMOTE_DIR" = "/public_html" ] || [[ "$FTP_REMOTE_DIR" == *"/public_html" ]]; then
            echo "FTP_REMOTE_DIR must be the document root itself (use '.'), not a nested public_html folder."
            exit 1
          fi

          lftp -c "
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p \"$FTP_PORT\" ftp://$FTP_HOST;
            mkdir -p \"$FTP_REMOTE_DIR/live-data\";
            put \"public/live-data/teams-details.json\" -o \"$FTP_REMOTE_DIR/live-data/teams-details.json\";
            bye
          "
